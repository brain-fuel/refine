name: Publish Maven artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match the checked-out tag)"
        required: true
        default: "0.4.0"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Only the Refine producer compiles Go to the published JVM engine.
      # Projects consuming refine-maven-plugin need Java/Maven only.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Publish to Maven Central
        env:
          MAVEN_OPTS: -Xmx3g
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_KEY_FINGERPRINT: ${{ secrets.MAVEN_GPG_KEY_ID }}
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'XML'
          <settings><servers><server><id>central</id><username>${env.MAVEN_USERNAME}</username><password>${env.MAVEN_PASSWORD}</password></server></servers></settings>
          XML
          mvn --batch-mode -s "$HOME/.m2/settings.xml" -f maven/pom.xml \
            -Pcentral-release -DperformCentralRelease -Dgpg.signer=bc clean deploy
