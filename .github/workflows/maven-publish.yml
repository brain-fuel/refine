name: Publish Maven artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match the checked-out tag)"
        required: true
        default: "0.1.0"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Import signing key
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: echo "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'XML'
          <settings><servers><server><id>central</id><username>${env.MAVEN_USERNAME}</username><password>${env.MAVEN_PASSWORD}</password></server></servers></settings>
          XML
          mvn --batch-mode -s "$HOME/.m2/settings.xml" -f maven/pom.xml \
            -Pcentral-release -DperformCentralRelease -Dgpg.keyname="${{ secrets.MAVEN_GPG_KEY_ID }}" clean deploy
