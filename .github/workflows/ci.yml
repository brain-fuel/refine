name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    env:
      REFINE_REQUIRE_JAVA: '1'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Provision pinned Java property-test dependencies
        shell: bash
        run: |
          jetcheck_dir=$(mktemp -d "$RUNNER_TEMP/refine-jetcheck.XXXXXX")
          curl --fail --silent --show-error --location --retry 3 https://repo.maven.apache.org/maven2/org/jetbrains/jetCheck/0.3.0/jetCheck-0.3.0.jar -o "$jetcheck_dir/jetCheck-0.3.0.jar"
          curl --fail --silent --show-error --location --retry 3 https://repo.maven.apache.org/maven2/org/jetbrains/annotations/13.0/annotations-13.0.jar -o "$jetcheck_dir/annotations-13.0.jar"
          echo "REFINE_JETCHECK_DIR=$jetcheck_dir" >> "$GITHUB_ENV"
          # Go tests check pinned SHA-256 digests before executing these jars.
      - name: Verify pinned GoPlus and generated sources
        run: |
          go tool goplus version
          go tool goplus gen --check ./...
          go generate ./...
          git diff --exit-code -- '*.go' go.mod go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build and exercise the development CLI
        run: |
          go build -o bin/refine ./cmd/refine
          bin/refine typecheck --json language/testdata/contracts.refine
          bin/refine fmt language/testdata/contracts.refine > /tmp/refine-formatted.refine
          bin/refine typecheck /tmp/refine-formatted.refine
      - name: Fuzz lossless ingestion and text codecs
        run: |
          go test ./schemajson -run '^$' -fuzz '^FuzzLosslessDocument$' -fuzztime=10s
          go test ./value -run '^$' -fuzz '^FuzzTextReadShow$' -fuzztime=10s
          go test ./value -run '^$' -fuzz '^FuzzTimestampReadShow$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./pattern -run '^$' -fuzz '^FuzzRegexDifferential$' -fuzztime=10s
          go test ./provenance -run '^$' -fuzz '^FuzzNativeConstraintRoundTrip$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./language -run '^$' -fuzz '^FuzzParseFormat$' -fuzztime=10s
          go test ./language -run '^$' -fuzz '^FuzzCompile$' -fuzztime=10s
          go test ./language -run '^$' -fuzz '^FuzzEvaluatorDeterminism$' -fuzztime=10s
          go test ./language -run '^$' -fuzz '^FuzzTypedReadShow$' -fuzztime=10s
          go test ./language -run '^$' -fuzz '^FuzzPayloadType$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./value -run '^$' -fuzz '^FuzzDataMutationIsolation$' -fuzztime=10s
          go test ./java -run '^$' -fuzz '^FuzzRuntimePackageNames$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./java -run '^$' -fuzz '^FuzzValidatorGeneration$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./java -run '^$' -fuzz '^FuzzModelGeneration$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./java -run '^$' -fuzz '^FuzzPayloadTypeGeneration$' -fuzztime=10s -fuzzminimizetime=1000x
