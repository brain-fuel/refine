name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    env:
      REFINE_REQUIRE_JAVA: '1'
      REFINE_REQUIRE_MAVEN: '1'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Provision pinned Java property-test dependencies
        shell: bash
        run: |
          jetcheck_dir=$(mktemp -d "$RUNNER_TEMP/refine-jetcheck.XXXXXX")
          curl --fail --silent --show-error --location --retry 3 https://repo.maven.apache.org/maven2/org/jetbrains/jetCheck/0.3.0/jetCheck-0.3.0.jar -o "$jetcheck_dir/jetCheck-0.3.0.jar"
          curl --fail --silent --show-error --location --retry 3 https://repo.maven.apache.org/maven2/org/jetbrains/annotations/13.0/annotations-13.0.jar -o "$jetcheck_dir/annotations-13.0.jar"
          echo "REFINE_JETCHECK_DIR=$jetcheck_dir" >> "$GITHUB_ENV"
          # Go tests check pinned SHA-256 digests before executing these jars.
      - name: Provision pinned Jackson 3 serde-test dependencies
        shell: bash
        run: |
          jackson_dir=$(mktemp -d "$RUNNER_TEMP/refine-jackson.XXXXXX")
          curl --fail --silent --show-error --location --retry 3 https://repo.maven.apache.org/maven2/tools/jackson/core/jackson-databind/3.2.0/jackson-databind-3.2.0.jar -o "$jackson_dir/jackson-databind-3.2.0.jar"
          curl --fail --silent --show-error --location --retry 3 https://repo.maven.apache.org/maven2/tools/jackson/core/jackson-core/3.2.0/jackson-core-3.2.0.jar -o "$jackson_dir/jackson-core-3.2.0.jar"
          curl --fail --silent --show-error --location --retry 3 https://repo.maven.apache.org/maven2/com/fasterxml/jackson/core/jackson-annotations/2.22/jackson-annotations-2.22.jar -o "$jackson_dir/jackson-annotations-2.22.jar"
          echo "REFINE_JACKSON_DIR=$jackson_dir" >> "$GITHUB_ENV"
          # Go tests check pinned SHA-256 digests before executing these jars.
      - name: Provision pinned Avro serde-test dependencies
        shell: bash
        run: |
          avro_dir=$(mktemp -d "$RUNNER_TEMP/refine-avro.XXXXXX")
          for artifact in \
            org/apache/avro/avro/1.12.0/avro-1.12.0.jar \
            com/fasterxml/jackson/core/jackson-core/2.17.2/jackson-core-2.17.2.jar \
            com/fasterxml/jackson/core/jackson-databind/2.17.2/jackson-databind-2.17.2.jar \
            com/fasterxml/jackson/core/jackson-annotations/2.17.2/jackson-annotations-2.17.2.jar \
            org/apache/commons/commons-compress/1.26.2/commons-compress-1.26.2.jar \
            commons-codec/commons-codec/1.17.0/commons-codec-1.17.0.jar \
            commons-io/commons-io/2.16.1/commons-io-2.16.1.jar \
            org/apache/commons/commons-lang3/3.14.0/commons-lang3-3.14.0.jar \
            org/slf4j/slf4j-api/2.0.13/slf4j-api-2.0.13.jar \
            org/slf4j/slf4j-simple/2.0.13/slf4j-simple-2.0.13.jar
          do
            curl --fail --silent --show-error --location --retry 3 "https://repo.maven.apache.org/maven2/$artifact" -o "$avro_dir/${artifact##*/}"
          done
          echo "REFINE_AVRO_DIR=$avro_dir" >> "$GITHUB_ENV"
          # Go tests check pinned SHA-256 digests before executing these jars.
      - name: Provision pinned native JSON validation dependencies
        shell: bash
        run: |
          native_json_dir=$(mktemp -d "$RUNNER_TEMP/refine-native-json.XXXXXX")
          for artifact in \
            com/networknt/json-schema-validator/3.0.7/json-schema-validator-3.0.7.jar \
            tools/jackson/core/jackson-databind/3.2.1/jackson-databind-3.2.1.jar \
            tools/jackson/core/jackson-core/3.2.1/jackson-core-3.2.1.jar \
            com/fasterxml/jackson/core/jackson-annotations/2.22/jackson-annotations-2.22.jar \
            tools/jackson/dataformat/jackson-dataformat-yaml/3.2.1/jackson-dataformat-yaml-3.2.1.jar \
            com/ethlo/time/itu/1.14.0/itu-1.14.0.jar \
            org/slf4j/slf4j-api/2.0.17/slf4j-api-2.0.17.jar
          do
            curl --fail --silent --show-error --location --retry 3 "https://repo.maven.apache.org/maven2/$artifact" -o "$native_json_dir/${artifact##*/}"
          done
          echo "REFINE_NETWORKNT_DIR=$native_json_dir" >> "$GITHUB_ENV"
          # Go tests verify all seven pinned SHA-256 digests before execution.
      - name: Provision pinned Maven for unsigned build integration
        shell: bash
        run: |
          maven_dir=$(mktemp -d "$RUNNER_TEMP/refine-maven.XXXXXX")
          curl --fail --silent --show-error --location --retry 3 https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz -o "$maven_dir/maven.tar.gz"
          printf '%s  %s\n' '831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6' "$maven_dir/maven.tar.gz" | shasum -a 512 -c -
          tar -xzf "$maven_dir/maven.tar.gz" -C "$maven_dir"
          echo "REFINE_MAVEN_HOME=$maven_dir/apache-maven-3.9.16" >> "$GITHUB_ENV"
      - name: Verify pinned GoPlus and generated sources
        run: |
          go tool goplus version
          go tool goplus gen --check ./...
          go generate ./...
          git diff --exit-code -- '*.go' go.mod go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build and exercise the development CLI
        run: |
          go build -o bin/refine ./cmd/refine
          bin/refine typecheck --json language/testdata/contracts.refine
          bin/refine fmt language/testdata/contracts.refine > /tmp/refine-formatted.refine
          bin/refine typecheck /tmp/refine-formatted.refine
          bin/refine explain --json language/testdata/contracts.refine
      - name: Fuzz lossless ingestion and text codecs
        run: |
          go test ./schemajson -run '^$' -fuzz '^FuzzLosslessDocument$' -fuzztime=10s
          go test ./value -run '^$' -fuzz '^FuzzTextReadShow$' -fuzztime=10s
          go test ./value -run '^$' -fuzz '^FuzzTimestampReadShow$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./pattern -run '^$' -fuzz '^FuzzRegexDifferential$' -fuzztime=10s
          go test ./provenance -run '^$' -fuzz '^FuzzNativeConstraintRoundTrip$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./language -run '^$' -fuzz '^FuzzParseFormat$' -fuzztime=10s
          go test ./language -run '^$' -fuzz '^FuzzCompile$' -fuzztime=10s
          go test ./language -run '^$' -fuzz '^FuzzEvaluatorDeterminism$' -fuzztime=10s
          go test ./language -run '^$' -fuzz '^FuzzTypedReadShow$' -fuzztime=10s
          go test ./language -run '^$' -fuzz '^FuzzPayloadType$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./value -run '^$' -fuzz '^FuzzDataMutationIsolation$' -fuzztime=10s
          go test ./java -run '^$' -fuzz '^FuzzRuntimePackageNames$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./java -run '^$' -fuzz '^FuzzValidatorGeneration$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./java -run '^$' -fuzz '^FuzzModelGeneration$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./java -run '^$' -fuzz '^FuzzPayloadTypeGeneration$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./analysis -run '^$' -fuzz '^FuzzAnalysis$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./explain -run '^$' -fuzz '^FuzzExplain$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./native -run '^$' -fuzz '^FuzzNativeJSONRoundTrip$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./native -run '^$' -fuzz '^FuzzValidateAvroBinary$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./native -run '^$' -fuzz '^FuzzOpenAPIPayloadValidation$' -fuzztime=10s -fuzzminimizetime=1000x
          go test ./native -run '^$' -fuzz '^FuzzDecodeAndValidateJSON$' -fuzztime=10s -fuzzminimizetime=1000x
